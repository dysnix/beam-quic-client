[package]
name = "beam-quic-client"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
description = "Rust client for Beam QUIC transaction submission"
readme = "README.md"
keywords = ["beam", "quic", "solana"]
categories = ["api-bindings", "network-programming"]

[features]
default = []
solana-sdk = ["solana-transaction"]
solana-transaction = ["dep:bincode", "dep:solana-transaction"]

[dependencies]
base64 = "0.22.1"
beam-quic-protocol = { version = "0.1.0", path = "../beam-quic-protocol" }
bincode = { version = "1.3.3", optional = true }
quinn = "0.11.9"
rcgen = "0.14.8"
rustls = { version = "0.23.37", default-features = true }
rustls-native-certs = "0.8.4"
rustls-pemfile = "2.2.0"
solana-transaction = { version = "4", features = ["serde"], optional = true }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
x509-parser = "0.18.1"
